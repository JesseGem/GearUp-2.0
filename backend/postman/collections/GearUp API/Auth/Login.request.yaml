$kind: http-request
order: 1000
method: POST
url: '{{base_url}}/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.accessToken) {
        pm.environment.set('accessToken', res.accessToken);
        console.log('✅ accessToken saved to environment');
      } else {
        console.error('❌ Login failed – no accessToken in response:', JSON.stringify(res));
      }
